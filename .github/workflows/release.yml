name: Release npm packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in the reviewed v-prefixed tag
        required: true
        type: string
      channel:
        description: alpha for the authorized experimental release; next/latest remain acceptance-gated
        required: true
        default: alpha
        type: choice
        options: [alpha, next, latest]
      bootstrap:
        description: Sign alpha archives for the owner's first authenticated publication
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - name: Verify destination, tag and acceptance
        id: release
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = false
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(next|alpha|beta|rc)\.[0-9]+)?$ ]]
          sha=$(git rev-parse "refs/tags/v${VERSION}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('packages/kit/package.json')).version !== process.env.VERSION) throw new Error('Tag/version mismatch')"
          node scripts/check-release.mjs --channel="$RELEASE_CHANNEL"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release-channel: ${{ inputs.channel }}
  publish:
    if: inputs.bootstrap != true
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages-${{ github.run_id }}
          path: .work/release
      - name: Verify the downloaded consumer-tested archives
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          cd .work/release
          sha256sum --check SHA256SUMS
          cd ../..
          node scripts/check-release.mjs --artifacts=.work/release --channel="$RELEASE_CHANNEL"
      - name: Publish through npm trusted publishing
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          npm publish ".work/release/adula-kit-${VERSION}.tgz" --access public --provenance --tag "$RELEASE_CHANNEL" --ignore-scripts
          npm publish ".work/release/adula-ui-${VERSION}.tgz" --access public --provenance --tag "$RELEASE_CHANNEL" --ignore-scripts
          npm publish ".work/release/adula-create-app-${VERSION}.tgz" --access public --provenance --tag "$RELEASE_CHANNEL" --ignore-scripts
  bootstrap:
    if: inputs.bootstrap == true && inputs.channel == 'alpha'
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages-${{ github.run_id }}
          path: .work/release
      - name: Verify and sign the exact consumer-tested alpha archives
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd .work/release
          sha256sum --check SHA256SUMS
          cd ../..
          node scripts/check-release.mjs --artifacts=.work/release --channel=alpha
          node scripts/sign-bootstrap.mjs "$(npm root -g)/npm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-alpha-${{ github.run_id }}
          path: |
            .work/release/*.tgz
            .work/release/*.sigstore
            .work/release/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
